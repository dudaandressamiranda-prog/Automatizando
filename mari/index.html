<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<meta http-equiv="refresh" content="0; url=https://rotina-da-mari.vercel.app/" />
<title>Mari mudou de endereço</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F5EDE1; color: #1F3A4D;
         font: 18px/1.5 system-ui, -apple-system, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  a { display: inline-block; margin-top: 16px; background: #2D5B78; color: #fff; padding: 14px 22px; border-radius: 14px;
      text-decoration: none; font-weight: 700; }
</style>
<script>
  // O app antigo guardava uma cópia para abrir sem internet: apaga e vai para o endereço novo.
  if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister())).catch(() => {});
  if (window.caches) caches.keys().then((ks) => ks.forEach((k) => caches.delete(k))).catch(() => {});
  location.replace('https://rotina-da-mari.vercel.app/');
</script>
</head>
<body>
  <div>
    <p>🐋 O app da Mari mudou de endereço.</p>
    <a href="https://rotina-da-mari.vercel.app/">Abrir o app novo</a>
  </div>
</body>
</html>
